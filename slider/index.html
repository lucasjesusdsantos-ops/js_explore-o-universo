<!DOCTYPE html>
<html lang="pt-br">
 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slider com Splide</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css">
  <link rel="stylesheet" href="css/estilos.css">
</head>
 
<body>
 
  <h1>Slider de conteúdo usando a lib Splide</h1>
  <p>
    Site oficial:
    <a href="https://splidejs.com/" target="_blank">Splide - The lightweight, flexible and accessible slider/carousel</a>
  </p>
  <p>
    Arquivos necessários disponíveis via CDN:
    <a href="https://www.jsdelivr.com/package/npm/@splidejs/splide" target="_blank">jsDelivr</a>
  </p>
 
  <hr>
 
  <div class="slider">
 
    <section class="splide" aria-label="Splide Basic HTML Example">
  <div class="splide__track">
    <ul class="splide__list">
      <li class="splide__slide"><img src="imagens/slider-foto01.jpg" alt=""></li>
      <li class="splide__slide"><img src="imagens/slider-foto02.jpg" alt=""></li>
      <li class="splide__slide"><img src="imagens/slider-foto03.jpg" alt=""></li>
    </ul>
  </div>
</section>
 
  </div>
 
<script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
 
<script src="js/slider.js"></script>
 
</body>
 
</html>
